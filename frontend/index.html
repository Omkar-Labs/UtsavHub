<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UtsavHub - Collegiate Event & Squad Management Platform</title>

    <!-- Google Fonts: Space Grotesk & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              // Warm Alabaster & Coral Flame (Luma/Eventbrite Editorial Light Palette)
              'primary': '#E11D48',             // Vibrant Rose-600 / Coral Flame
              'primary-hover': '#BE123C',       // Deep Rose-700
              'primary-container': '#FFE4E6',   // Soft Rose-100 Glow
              'on-primary': '#ffffff',
              'on-primary-container': '#9F1239',

              'secondary': '#C2410C',           // Warm Amber / Terra
              'secondary-container': '#FFF7ED',
              'on-secondary': '#431407',

              'tertiary': '#047857',            // Emerald Leaf
              'tertiary-container': '#ECFDF5',

              'background': '#FAF9F6',          // Warm Alabaster
              'surface': '#ffffff',             // Crisp Pure White
              'surface-container-low': '#FAF9F6',
              'surface-container': '#F3F1EC',   // Subtle Secondary Sand
              'surface-container-high': '#EAE7E1',
              'surface-container-highest': '#E4E2DD',

              'on-surface': '#18181B',          // Deep Charcoal zinc-900
              'on-surface-variant': '#52525B',  // zinc-600
              'outline': '#E4E2DD',             // Hairline sand border
              'outline-variant': '#D4D0C8'
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
              headline: ['Space Grotesk', 'sans-serif']
            }
          }
        }
      };
    </script>
    <style>
      body {
        background-color: #FAF9F6;
        color: #18181B;
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #FAF9F6;
      }
      ::-webkit-scrollbar-thumb {
        background: #E4E2DD;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #D4D0C8;
      }
    </style>
    <!-- Razorpay Standard Checkout SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body class="bg-[#FAF9F6] text-[#18181B] min-h-screen selection:bg-[#FFE4E6] selection:text-[#E11D48]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
